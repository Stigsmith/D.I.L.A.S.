<!doctype html>
<!-- The link preview card, public/share.png. Our own drawing: the favicon's
     mark, the vendored fonts and the brand colours, no game art. Edited by
     hand like the favicon; scripts/share-card.mjs fills the {{...}} from
     src/lib/brand.js and shoots it at 1200 x 630. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: "Oswald";
    font-weight: 200 700;
    src: url("{{root}}/public/fonts/oswald-TK3IWkUHHAIjg75cFRf3bXL8LICs1_Fv40pKlN4NNSeSASz7FmlWHYg.woff2") format("woff2");
  }
  @font-face {
    font-family: "JetBrains Mono";
    font-weight: 100 800;
    src: url("{{root}}/public/fonts/jetbrains-mono-tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxDcwg.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #121214; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(ellipse 620px 460px at 250px 330px, rgba(255, 233, 0, 0.13), transparent 70%),
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px) 0 0 / 40px 40px,
      #121214;
    color: #F2F0E8;
  }
  .stripe {
    position: absolute; left: 0; right: 0; height: 22px;
    background: repeating-linear-gradient(135deg, #FFE900 0 18px, #121214 18px 36px);
  }
  .stripe.top { top: 0; }
  .stripe.bottom { bottom: 0; height: 10px; }
  .mark {
    position: absolute; left: 70px; top: 135px; width: 360px; height: 360px;
    filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.6));
  }
  .text { position: absolute; left: 490px; top: 120px; right: 60px; }
  .short {
    font-family: "Oswald"; font-weight: 700; font-size: 150px; line-height: 0.95;
    color: #FFE900; letter-spacing: 2px;
    text-shadow: 0 6px 30px rgba(255, 233, 0, 0.25);
  }
  .full {
    margin-top: 14px; font-family: "Oswald"; font-weight: 500; font-size: 27px;
    line-height: 1.3; letter-spacing: 3.5px; text-transform: uppercase; color: #B9B6AC;
  }
  .rule { margin: 26px 0 22px; height: 3px; width: 120px; background: #FFE900; }
  .line { font-family: "JetBrains Mono"; font-weight: 500; font-size: 27px; color: #F2F0E8; }
  .fronts { position: absolute; left: 490px; bottom: 58px; display: flex; gap: 14px; }
  .front {
    font-family: "Oswald"; font-weight: 600; font-size: 19px; letter-spacing: 2.5px;
    text-transform: uppercase; padding: 6px 14px; border: 2px solid; border-radius: 4px;
  }
  .url {
    position: absolute; right: 60px; bottom: 60px;
    font-family: "JetBrains Mono"; font-weight: 700; font-size: 26px; color: #FFE900;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stripe top"></div>
    <img class="mark" src="{{root}}/public/favicon.svg" alt="" />
    <div class="text">
      <div class="short">{{short}}</div>
      <div class="full">{{line1}}<br />{{line2}}</div>
      <div class="rule"></div>
      <div class="line">{{cardLine}}</div>
    </div>
    <div class="fronts">
      <span class="front" style="color: #EF4444; background: rgba(239, 68, 68, 0.1)">Automatons</span>
      <span class="front" style="color: #F97316; background: rgba(249, 115, 22, 0.1)">Terminids</span>
      <span class="front" style="color: #A855F7; background: rgba(168, 85, 247, 0.1)">Illuminate</span>
    </div>
    <div class="url">{{host}}</div>
    <div class="stripe bottom"></div>
  </div>
</body>
</html>
